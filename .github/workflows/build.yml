name: NeonAmp build

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath NeonAmp-windows-x64.zip
      - name: Upload Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: NeonAmp-windows-x64
          path: NeonAmp-windows-x64.zip
      - name: Configure native tracker tests
        run: cmake -S windows -B build/windows/x64 -DNEONAMP_BUILD_TRACKER_TESTS=ON
      - name: Build native tracker tests
        run: cmake --build build/windows/x64 --config Release --target tracker_decoder_test
      - name: Test native tracker decoding
        run: ctest --test-dir build/windows/x64/runner/tracker -C Release --output-on-failure

  build-android:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build Android release
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Android build attempt $attempt failed; retrying dependency resolution..."
              sleep 15
            fi
          done
          exit 1
      - name: Upload Android release package
        uses: actions/upload-artifact@v4
        with:
          name: NeonAmp-android
          path: build/app/outputs/flutter-apk/app-release.apk

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyze-and-test, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: NeonAmp-windows-x64
      - name: Download Android package
        uses: actions/download-artifact@v4
        with:
          name: NeonAmp-android
          path: android
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            NeonAmp-windows-x64.zip
            android/app-release.apk
