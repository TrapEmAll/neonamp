name: NeonAmp build

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Configure native tracker tests
        run: cmake -S windows -B build/windows/x64 -DNEONAMP_BUILD_TRACKER_TESTS=ON
      - name: Build native tracker tests
        run: cmake --build build/windows/x64 --config Release --target tracker_decoder_test
      - name: Test native tracker decoding
        run: ctest --test-dir build/windows/x64/runner/tracker -C Release --output-on-failure

  build-android:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build Android release
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Android build attempt $attempt failed; retrying dependency resolution..."
              sleep 15
            fi
          done
          exit 1
