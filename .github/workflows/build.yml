name: NeonAmp build

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Fetch default MIDI SoundFont
        run: python tool/fetch_default_soundfont.py
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Fetch dependencies
        run: flutter pub get
      - name: Fetch default MIDI SoundFont
        run: python tool/fetch_default_soundfont.py
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath NeonAmp-windows-x64.zip
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          $version = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $Matches[1] } else { '1.0.0' }
          & $iscc "/DAppVersion=$version" 'installer\neonamp.iss'
          Copy-Item -LiteralPath "release\NeonAmp-Setup-$version.exe" -Destination "NeonAmp-Setup-$version.exe"
      - name: Upload Windows release package
        uses: actions/upload-artifact@v7
        with:
          name: NeonAmp-windows-x64
          path: |
            NeonAmp-windows-x64.zip
            NeonAmp-Setup-*.exe
      - name: Configure native tracker tests
        run: cmake -S windows -B build/windows/x64 -DNEONAMP_BUILD_TRACKER_TESTS=ON
      - name: Build native tracker tests
        run: cmake --build build/windows/x64 --config Release --target tracker_decoder_test
      - name: Test native tracker decoding
        run: ctest --test-dir build/windows/x64/runner/tracker -C Release --output-on-failure

  build-android:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Fetch default MIDI SoundFont
        run: python tool/fetch_default_soundfont.py
      - name: Require Android upload signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          test -n "$ANDROID_UPLOAD_STORE_PASSWORD"
          test -n "$ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD"
      - name: Configure Android upload signing
        if: ${{ env.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keys
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > keys/neonamp-upload.jks
          {
            printf 'storeFile=../keys/neonamp-upload.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_UPLOAD_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_UPLOAD_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_UPLOAD_KEY_PASSWORD"
          } > android/key.properties
      - name: Build Android release
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --target-platform android-arm,android-arm64 && \
              flutter build appbundle --release --target-platform android-arm,android-arm64 && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Android build attempt $attempt failed; retrying dependency resolution..."
              sleep 15
            fi
          done
          exit 1
      - name: Verify Android release artifacts
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab=build/app/outputs/bundle/release/app-release.aab
          test -s "$apk"
          test -s "$aab"

          echo 'Packaged APK native libraries:'
          unzip -Z1 "$apk" | grep '^lib/' | sort || true
          echo 'Packaged App Bundle native libraries:'
          unzip -Z1 "$aab" | grep -E '(^|/)lib/' | sort || true

          # The Play Store bundle may contain only the ARM ABIs we explicitly
          # support. A few Android toolchains carry an unused C++ runtime shim
          # for x86_64; it is not an executable app/plugin slice and is safe to
          # retain. Catch every other x86 leakage before publication.
          unsupported_apk=$(unzip -Z1 "$apk" | grep -E '^lib/(x86|x86_64)/' | grep -v '/x86_64/libc++_shared\.so$' || true)
          if [ -n "$unsupported_apk" ]; then
            echo 'APK contains unsupported x86 native libraries.' >&2
            printf '%s\n' "$unsupported_apk" >&2
            exit 1
          fi
          unsupported_aab=$(unzip -Z1 "$aab" | grep -E '(^|/)lib/(x86|x86_64)/' | grep -v '/x86_64/libc++_shared\.so$' || true)
          if [ -n "$unsupported_aab" ]; then
            echo 'App Bundle contains unsupported x86 native libraries.' >&2
            printf '%s\n' "$unsupported_aab" >&2
            exit 1
          fi
          unzip -Z1 "$apk" | grep -Eq '^lib/armeabi-v7a/'
          unzip -Z1 "$apk" | grep -Eq '^lib/arm64-v8a/'
          unzip -Z1 "$aab" | grep -Eq '(^|/)lib/armeabi-v7a/'
          unzip -Z1 "$aab" | grep -Eq '(^|/)lib/arm64-v8a/'
          sha256sum "$apk" "$aab"
      - name: Upload Android release package
        uses: actions/upload-artifact@v7
        with:
          name: NeonAmp-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyze-and-test, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v7
        with:
          name: NeonAmp-windows-x64
      - name: Download Android package
        uses: actions/download-artifact@v7
        with:
          name: NeonAmp-android
          path: android
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            NeonAmp-windows-x64.zip
            NeonAmp-Setup-*.exe
            android/app-release.apk
            android/app-release.aab


