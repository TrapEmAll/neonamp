name: NeonAmp build

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tool/fetch_default_soundfont.py
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: python tool/fetch_default_soundfont.py
      - run: flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath NeonAmp-windows-x64.zip
      - name: Upload Windows release package
        uses: actions/upload-artifact@v7
        with:
          name: NeonAmp-windows-x64
          path: NeonAmp-windows-x64.zip

  build-android:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tool/fetch_default_soundfont.py
      - name: Build Android ARM release
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --target-platform android-arm,android-arm64 && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: NeonAmp-android
          path: build/app/outputs/flutter-apk/app-release.apk

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyze-and-test, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: NeonAmp-windows-x64
      - uses: actions/download-artifact@v7
        with:
          name: NeonAmp-android
          path: android
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            NeonAmp-windows-x64.zip
            android/app-release.apk
