name: NeonAmp build

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Configure native tracker tests
        run: cmake -S windows -B build/windows/x64 -DNEONAMP_BUILD_TRACKER_TESTS=ON
      - name: Build native tracker tests
        run: cmake --build build/windows/x64 --config Release --target tracker_decoder_test
      - name: Test native tracker decoding
        run: ctest --test-dir build/windows/x64/runner/tracker -C Release --output-on-failure
      - name: Package Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "NeonAmp-Windows-${{ github.ref_name }}.zip"
      - name: Upload Windows release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: NeonAmp-Windows-${{ github.ref_name }}.zip

  build-android:
    runs-on: ubuntu-24.04
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build Android release
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --target-platform android-arm,android-arm64 && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Android build attempt $attempt failed; retrying dependency resolution..."
              sleep 15
            fi
          done
          exit 1
      - name: Upload Android release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyze-and-test, build-windows, build-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-release
      - name: Download Android artifact
        uses: actions/download-artifact@v7
        with:
          name: android-release
          path: android
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "NeonAmp $GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "NeonAmp-Windows-$GITHUB_REF_NAME.zip" \
            android/app-release.apk \
            --clobber
